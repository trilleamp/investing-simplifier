// ─── UTILITY FUNCTIONS ──────────────────────────────────────────────────
const fmt = (n,d=1) => n==null?"—":n>=1000?`$${(n/1000).toFixed(d)}B`:`$${n.toFixed(0)}M`;
const pct = (n,d=0) => n==null?"—":`${n.toFixed(d)}%`;
const badge = (actual,est) => {
  if(actual==null||est==null) return null;
  const diff=((actual-est)/Math.abs(est))*100;
  if(diff>1) return {label:"BEAT",color:"#22c55e",pct:diff.toFixed(1)};
  if(diff<-1) return {label:"MISS",color:"#ef4444",pct:diff.toFixed(1)};
  return {label:"IN-LINE",color:"#f59e0b",pct:diff.toFixed(1)};
};
const arrow = (curr,prev) => {
  if(curr==null||prev==null) return "";
  return curr>prev?"▲":"▼";
};

function MetricBox({label,value,sub,color}){
  return <div style={sCard}>
    <div style={sLabel}>{label}</div>
    <div style={{...sValue,color:color||C.text}}>{value}</div>
    {sub&&<div style={{...sSmall,marginTop:4}}>{sub}</div>}
  </div>;
}

function Badge({actual,estimate}){
  const b = badge(actual,estimate);
  if(!b) return null;
  return <span style={sBadge(b.color)}>{b.label} {b.pct>0?"+":""}{b.pct}%</span>;
}
