// ── Utilities ──
const p = (v) => parseFloat(v) || 0;
const fmt = (v, d = 1) => (typeof v === "number" && v !== 0 ? v.toFixed(d) : "—");
const fmtM = (v) => { const n = p(v); return n >= 1000 ? `$${(n/1000).toFixed(2)}B` : n > 0 ? `$${n.toFixed(0)}M` : "—"; };
const pct = (a, b) => b ? (((a - b) / Math.abs(b)) * 100).toFixed(1) : "—";
const arrow = (c, pr) => { if (!c || !pr || p(c) === 0 || p(pr) === 0) return ""; const cv = p(c), pv = p(pr); return cv > pv ? "↑" : cv < pv ? "↓" : "→"; };
const arrowColor = (a) => a === "↑" ? "#22c55e" : a === "↓" ? "#ef4444" : "#eab308";
const beatMiss = (actual, estimate) => { if (!actual || !estimate) return { label: "—", c: "#666" }; const a = p(actual), e = p(estimate); return a > e ? { label: `Beat +${pct(a,e)}%`, c: "#22c55e" } : a < e ? { label: `Miss ${pct(a,e)}%`, c: "#ef4444" } : { label: "In-line", c: "#eab308" }; };

function calcMDI(m) {
  const sc = { strengthening:1, structural:1, genuine:1, deeply:1, strong:1, intact:1, partial:0.5, overstated:0, absent:0, weak:0, mischaracterized:0, weakening:0, partially:0.5, information:0 };
  const s = [m.proprietaryData, m.regulatoryLockin, m.networkEffects, m.transactionEmbedding, m.systemOfRecord].reduce((a,v) => a + (sc[v]??0), 0);
  const tq = [m.threeQ1, m.threeQ2, m.threeQ3].filter(Boolean).length;
  const d = m.competitorCount === "0-5" ? "Early" : m.competitorCount === "6-20" ? "Mid" : "Late";
  const cl = s >= 4 ? "LOWER RISK" : s >= 2 ? "MEDIUM RISK" : "HIGH RISK";
  return { score: s, threeQ: tq, disruption: d, classification: cl, horizontal: m.horizontalThreat };
}

function calcAF(af) {
  const raw = p(af.d1Score)*0.15 + p(af.d2Score)*0.30 + p(af.d3Score)*0.15 + p(af.d4Score)*0.40;
  const dip = p(af.dipScore) <= 1 ? 0 : p(af.dipScore) <= 3 ? 0.5 : p(af.dipScore) === 4 ? 1.0 : 1.5;
  const cpp = p(af.cppScore) <= 3 ? 0 : p(af.cppScore) <= 6 ? 0.5 : p(af.cppScore) <= 9 ? 1.0 : 1.5;
  const f = Math.min(raw + dip + cpp, 10);
  const cls = f >= 7.5 ? "ANTIFRAGILE" : f >= 5.0 ? "ROBUST" : f >= 2.5 ? "FRAGILE" : "TERMINAL";
  return { raw: raw.toFixed(2), dipMod: dip, cppMod: cpp, final: f.toFixed(2), classification: cls };
}
