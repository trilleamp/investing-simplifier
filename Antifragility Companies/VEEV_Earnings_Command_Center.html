const p = (v) => parseFloat(v) || 0;
const fmtM = (v) => { const n = p(v); return n >= 1000 ? `$${(n/1000).toFixed(2)}B` : n > 0 ? `$${n.toFixed(0)}M` : "—"; };
const pct = (a, b) => b ? (((a - b) / Math.abs(b)) * 100).toFixed(1) : "—";
const arrow = (c, pr) => { if (!c || !pr || p(c)===0 || p(pr)===0) return ""; return p(c) > p(pr) ? "↑" : p(c) < p(pr) ? "↓" : "→"; };
const arrowC = (a) => a === "↑" ? "#22c55e" : a === "↓" ? "#ef4444" : "#eab308";
const beatMiss = (a, e) => { if (!a || !e) return { l: "—", c: "#666" }; const av=p(a), ev=p(e); return av > ev ? { l: `Beat +${pct(av,ev)}%`, c: "#22c55e" } : av < ev ? { l: `Miss ${pct(av,ev)}%`, c: "#ef4444" } : { l: "In-line", c: "#eab308" }; };

function calcMDI(m) {
  const sc = { strengthening:1, structural:1, genuine:1, deeply:1, strong:1, intact:1, partial:0.5, overstated:0, absent:0, weak:0, mischaracterized:0, partially:0.5, information:0 };
  const s = [m.proprietaryData, m.regulatoryLockin, m.networkEffects, m.transactionEmbedding, m.systemOfRecord].reduce((a,v) => a + (sc[v]??0), 0);
  const tq = [m.threeQ1, m.threeQ2, m.threeQ3].filter(Boolean).length;
  const cl = s >= 4 ? "LOWER RISK" : s >= 2 ? "MEDIUM RISK" : "HIGH RISK";
  return { score: s, threeQ: tq, classification: cl };
}

function calcAF(af) {
  const raw = p(af.d1)*0.15 + p(af.d2)*0.30 + p(af.d3)*0.15 + p(af.d4)*0.40;
  const dip = p(af.dip) <= 1 ? 0 : p(af.dip) <= 3 ? 0.5 : p(af.dip) === 4 ? 1.0 : 1.5;
  const cpp = p(af.cpp) <= 3 ? 0 : p(af.cpp) <= 6 ? 0.5 : p(af.cpp) <= 9 ? 1.0 : 1.5;
  const f = Math.min(raw + dip + cpp, 10);
  const cls = f >= 7.5 ? "ANTIFRAGILE" : f >= 5.0 ? "ROBUST" : f >= 2.5 ? "FRAGILE" : "TERMINAL";
  return { raw: raw.toFixed(2), dip, cpp, final: f.toFixed(2), cls };
}
